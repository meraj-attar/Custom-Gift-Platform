services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customgift
      POSTGRES_USER: customgift
      POSTGRES_PASSWORD: customgift
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customgift -d customgift"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me-please-32-bytes}
      DATABASE_URL: postgresql+psycopg://customgift:customgift@db:5432/customgift
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ADMIN_NAME: ${ADMIN_NAME:-CustomGift Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@customgift.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      PAYMENT_DEMO_MODE: ${PAYMENT_DEMO_MODE:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  backend_media:
